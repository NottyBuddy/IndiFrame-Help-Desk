<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indinext — Change Password</title>
  <link rel="stylesheet" href="auth.css?v=auth-clean-v2-20261105">
  <link rel="stylesheet" href="preloader.css?v=indinext-loader-snake-v3-20261105">
  <link rel="stylesheet" href="indinext-premium.css?v=indinext-ember-glass-20261105">
  <link rel="stylesheet" href="indinext-auth-refinement.css?v=auth-glass-v1-20261105">
  <link rel="stylesheet" href="indinext-liquid-glass.css?v=dark-glass-v1-20261106">
  <link rel="stylesheet" href="indinext-hybrid-system.css?v=hybrid-ui-v1">
  <link rel="stylesheet" href="indinext-liquid-glass-unified.css?v=orange-edge-liquid-glass-v1-20261107">
  <link rel="stylesheet" href="indinext-rebuild.css?v=20261108">
  <link rel="stylesheet" href="indinext-solar-system.css?v=solar-unified-v1">
</head>
<body class="password-workspace">
<div class="indinext-solar-bg" aria-hidden="true"><div class="indinext-solar-nebula"></div><div class="indinext-solar-scene"><div class="black-hole"><span class="black-hole-halo"></span><span class="black-hole-ring ring-outer"></span><span class="black-hole-ring ring-inner"></span><span class="black-hole-core"></span></div><div class="planet-orbit orbit-measure"><div class="planet-wrap"><span class="planet planet-measure"></span><span class="planet-label">MEASURE</span></div></div><div class="planet-orbit orbit-quote"><div class="planet-wrap"><span class="planet planet-quote"></span><span class="planet-label">QUOTE</span></div></div><div class="planet-orbit orbit-design"><div class="planet-wrap"><span class="planet planet-design"></span><span class="planet-label">DESIGN</span></div></div><div class="planet-orbit orbit-manufacture"><div class="planet-wrap"><span class="planet planet-manufacture"></span><span class="planet-label">MANUFACTURE</span></div></div><div class="planet-orbit orbit-deliver"><div class="planet-wrap"><span class="planet planet-deliver"></span><span class="planet-label">DELIVER</span></div></div><div class="planet-orbit orbit-install"><div class="planet-wrap"><span class="planet planet-install"></span><span class="planet-label">INSTALL</span></div></div><div class="planet-orbit orbit-service"><div class="planet-wrap"><span class="planet planet-service"></span><span class="planet-label">SERVICE</span></div></div></div></div>
<script src="preloader.js?v=indinext-loader-snake-v3-20261105"></script> <main class="panel">
    <h2>Change Password</h2>
    <p class="subtitle">Please create a strong password to continue.</p>

    <form id="changePasswordForm" novalidate>
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" placeholder="Enter new password" required>

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm new password" required>

      <button type="submit">Update Password</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const API = 'https://indiframe-helpdesk-api.mukuls2302.workers.dev';
    const token = sessionStorage.getItem('indiframe_token');

    if (!token) {
      window.location.href = 'index.html';
    }

    const statusEl = document.getElementById('status');
    const showStatus = (message, type = 'error') => {
      statusEl.textContent = message;
      statusEl.className = 'status ' + (type === 'success' ? 'success' : '');
    };

    document.getElementById('changePasswordForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || !confirmPassword) {
        showStatus('Please fill both password fields.');
        return;
      }

      if (newPassword.length < 10) {
        showStatus('Password must be at least 10 characters.');
        return;
      }

      if (newPassword !== confirmPassword) {
        showStatus('Passwords do not match.');
        return;
      }

      try {
        const response = await fetch(API + '/api/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ password: newPassword })
        });

        let data = {};
        try { data = await response.json(); } catch {}

        if (!response.ok) {
          throw new Error(data.error || 'Password change failed.');
        }

        showStatus('Password updated successfully! Redirecting...', 'success');
        sessionStorage.setItem('forcePasswordChange', 'false');
        setTimeout(() => window.location.href = 'dashboard.html', 600);
      } catch (error) {
        showStatus(error.message || 'Password change failed.');
      }
    });
  </script>
<script src="indinext-workspace-ui.js?v=hybrid-ui-v1"></script>
</body>
</html>
