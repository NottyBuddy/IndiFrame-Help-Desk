<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <style>
    :root {
      --navy: #173b70;
      --navy-2: #23509a;
      --bg: #eef4ff;
      --line: #dfe8f5;
      --text: #12233f;
      --muted: #64748b;
      --danger: #c62828;
      --success: #1d9a5d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #edf4ff 0%, #dfeaff 45%, #f8fbff 100%);
      font-family: Arial, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .panel {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(147, 170, 210, 0.28);
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      padding: 28px 28px 22px;
    }

    h2 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--navy-2);
      box-shadow: 0 0 0 4px rgba(35, 80, 154, 0.12);
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      color: white;
      font-size: 1.02rem;
      font-weight: 700;
      padding: 14px 18px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(23, 59, 112, 0.2);
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h2>Change Password</h2>
    <p class="subtitle">Please create a strong password to continue.</p>

    <form id="changePasswordForm" novalidate>
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" placeholder="Enter new password" required>

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm new password" required>

      <button type="submit">Update Password</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const API = 'https://indiframe-helpdesk-api.mukuls2302.workers.dev';
    const token = sessionStorage.getItem('indiframe_token');

    if (!token) {
      window.location.href = 'index.html';
    }

    const statusEl = document.getElementById('status');
    const showStatus = (message, type = 'error') => {
      statusEl.textContent = message;
      statusEl.className = 'status ' + (type === 'success' ? 'success' : '');
    };

    document.getElementById('changePasswordForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || !confirmPassword) {
        showStatus('Please fill both password fields.');
        return;
      }

      if (newPassword.length < 10) {
        showStatus('Password must be at least 10 characters.');
        return;
      }

      if (newPassword !== confirmPassword) {
        showStatus('Passwords do not match.');
        return;
      }

      try {
        const response = await fetch(API + '/api/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ password: newPassword })
        });

        let data = {};
        try { data = await response.json(); } catch {}

        if (!response.ok) {
          throw new Error(data.error || 'Password change failed.');
        }

        showStatus('Password updated successfully! Redirecting...', 'success');
        sessionStorage.setItem('forcePasswordChange', 'false');
        setTimeout(() => window.location.href = 'dashboard.html', 600);
      } catch (error) {
        showStatus(error.message || 'Password change failed.');
      }
    });
  </script>
</body>
</html>
