<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call Performance Details — Indinext</title><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="portal-theme.css?v=indinext-clean-auth-v4-20261105"><style>.cp-detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.cp-detail-card{padding:18px;border:1px solid rgba(173,211,211,.2);border-radius:16px;background:rgba(12,34,44,.72);color:#f3fbf8}.cp-detail-card span{display:block;color:#a9c4c3;font-size:11px;text-transform:uppercase}.cp-detail-card strong{display:block;font-size:24px;margin-top:8px}.cp-detail-table{width:100%;border-collapse:collapse;min-width:680px}.cp-detail-table th,.cp-detail-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.cp-detail-wrap{overflow:auto}.cp-detail-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.cp-detail-filters label{display:grid;gap:5px}.cp-detail-filters input,.cp-detail-filters select{padding:9px;border-radius:8px;border:1px solid var(--line)}@media(max-width:700px){.cp-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header class="topbar"><div><div class="brand">Indinext</div><div class="subtitle">Call Performance · Metric Drill-down</div></div><div class="topright"><a href="call-performance.html" class="logout-btn" style="text-decoration:none">Back to Overview</a><button id="logoutBtn" class="logout-btn">Logout</button></div></header><main class="wrap"><div class="head"><div><h1 id="detailTitle">Metric Details</h1><div class="muted">Date-wise and disposition-wise breakdown</div></div><div id="detailProfile" class="profile muted"></div></div><section class="card"><div class="cp-detail-filters"><label>From<input type="date" id="fromDate"></label><label>To<input type="date" id="toDate"></label><label>Agent<select id="agentFilter"><option value="">All agents
