<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiFrame Help Desk</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 30px #0001;
    }
    h1 { color: #173b70; font-size: 25px; margin-bottom: 8px; }
    p { color: #64748b; font-size: 14px; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #173b70;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #message { margin-top: 15px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>IndiFrame Help Desk</h1>
    <p>Employee Login Portal</p>

    <form id="loginForm">
      <label for="employeeId">Employee ID</label>
      <input id="employeeId" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">Login</button>
      <p id="message" role="status"></p>
    </form>
  </main>

  <script>
    const API = "https://indiframe-helpdesk-api.mukuls2302.workers.dev";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const button = document.getElementById("loginButton");
      const message = document.getElementById("message");
      button.disabled = true;
      message.textContent = "Logging in...";

      try {
        const response = await fetch(API + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            employeeId: document.getElementById("employeeId").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Login failed");
        }

        if (!data.token) {
          throw new Error("Login response mein token nahi mila.");
        }

        sessionStorage.setItem("indiframe_token", data.token);
        message.textContent = "Login successful! Dashboard abhi banana baaki hai.";
      } catch (error) {
        message.textContent = error.message === "Failed to fetch"
          ? "Server se connect nahi ho raha. API settings check karein."
          : error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
