<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>IndiFrame Help Desk</title>
  <style>
    :root {
      --navy: #173b70;
      --navy-2: #23509a;
      --bg: #eef4ff;
      --panel: #ffffff;
      --line: #dfe8f5;
      --text: #12233f;
      --muted: #64748b;
      --success: #1d9a5d;
      --danger: #c62828;
      --shadow: rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #edf4ff 0%, #dfeaff 45%, #f8fbff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .login-shell {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(147, 170, 210, 0.28);
      border-radius: 20px;
      padding: 28px 28px 22px;
      box-shadow: 0 20px 45px var(--shadow);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: clamp(2rem, 4vw, 2.7rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
      background: #fff;
      color: var(--text);
    }

    input:focus {
      border-color: var(--navy-2);
      box-shadow: 0 0 0 4px rgba(35, 80, 154, 0.12);
    }

    button {
      width: 100%;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      color: white;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease, box-shadow .2s ease;
      box-shadow: 0 10px 20px rgba(23, 59, 112, 0.2);
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled {
      opacity: 0.72;
      cursor: wait;
      transform: none;
    }

    .message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 0.96rem;
      font-weight: 600;
      text-align: left;
      color: var(--danger);
    }

    .message.success {
      color: var(--success);
    }

    .helper {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .helper strong { color: var(--navy); }

    /* GenZ reference theme — matching the employee dashboard */
    body{font-family:Inter,"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f5f1;color:#24233b}
    :root{--navy:#29245f;--navy-2:#635bdb;--bg:#f6f5f1;--panel:#fff;--line:#e9e7ef;--text:#24233b;--muted:#77758d;--success:#23866a;--danger:#c65362;--shadow:rgba(39,34,91,.10)}
    .login-shell{width:min(100%,460px);border:1px solid #eae8f0;border-radius:22px;padding:34px 32px 28px;box-shadow:0 18px 50px rgba(39,34,91,.09);background:#fff}
    h1{color:#29245f;letter-spacing:-.055em}
    .subtitle{color:#77758d}
    input{border-radius:11px;border-color:#e3e1eb}
    input:focus{border-color:#8e87ee;box-shadow:0 0 0 3px rgba(99,91,219,.12)}
    button{border-radius:11px;background:#635bdb;box-shadow:0 7px 16px rgba(99,91,219,.18)}
    button:hover{background:#5149c5}
    .helper strong{color:#635bdb}

    /* Critical first-paint brand palette: prevents the old theme flashing before shared CSS loads. */
    body{background:linear-gradient(135deg,#172b3a 0%,#1c4650 46%,#238f86 100%)!important;color:#293941}
    .login-shell{width:min(100%,470px);border:1px solid rgba(255,255,255,.72);border-radius:20px;padding:42px 40px 34px;background:rgba(255,255,255,.97);box-shadow:0 28px 75px rgba(7,24,35,.28)}
    h1{color:#1d3441}.subtitle{color:#74848a}
    input{height:47px;border:1px solid #dce6e6;border-radius:9px;background:#f8fbfb}
    button{height:48px;border-radius:9px;background:linear-gradient(100deg,#1c827d,#25a99b);box-shadow:0 9px 18px rgba(31,151,139,.22)}
    @media(max-width:520px){.login-shell{padding:32px 24px 26px}}
  </style>
  <link rel="stylesheet" href="portal-theme.css?v=motion-system-20261103">
</head>
<body> <main class="login-shell">
    <h1>IndiFrame Help Desk</h1>
    <p class="subtitle">Employee Login Portal</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="employeeId">Employee ID</label>
        <input id="employeeId" name="employeeId" autocomplete="username" placeholder="Enter employee ID" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      </div>

      <button id="loginButton" type="submit">Login</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

  </main>

  <script src="api.js"></script>
  <script>
    const API = window.IndiFrameAPI.API_BASE;
    const showMessage = (text, type = 'error') => {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = 'message ' + (type === 'success' ? 'success' : '');
    };

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const employeeId = document.getElementById('employeeId').value.trim();
      const password = document.getElementById('password').value;
      const button = document.getElementById('loginButton');

      if (!employeeId || !password) {
        showMessage('Please enter both Employee ID and password.');
        return;
      }

      button.disabled = true;
      showMessage('Logging in...');

      try {
        const response = await fetch(API + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employeeId, password })
        });

        let data = {};
        try { data = await response.json(); } catch {}

        if (!response.ok) {
          throw new Error(data.error || 'Invalid Employee ID or password');
        }

        if (!data.token) {
          throw new Error('Login response mein token nahi mila.');
        }

        sessionStorage.setItem('indiframe_token', data.token);

        const shouldForcePasswordChange = data.mustChangePassword === true;

        if (shouldForcePasswordChange) {
          sessionStorage.setItem('forcePasswordChange', 'true');
          showMessage('Default password detected. Redirecting to password change...', 'success');
          setTimeout(() => window.location.href = 'change-password.html', 500);
          return;
        }

        sessionStorage.setItem('forcePasswordChange', 'false');
        showMessage('Login successful! Opening dashboard...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 500);
      } catch (error) {
        const text = error.message === 'Failed to fetch'
          ? 'Server se connect nahi ho raha. API settings check karein.'
          : error.message;
        showMessage(text);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
