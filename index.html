<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Indinext</title>
  <link rel="stylesheet" href="portal-theme.css?v=indinext-clean-auth-v4-20261105">
  <link rel="stylesheet" href="login.css?v=clean-login-v1-20261105">
  <link rel="stylesheet" href="preloader.css?v=indinext-liquid-glass-20261105">
</head>
<body>
<script src="preloader.js?v=indinext-liquid-glass-20261105"></script>
<main class="login-layout">
<section class="login-showcase">
<div class="showcase-brand"><span class="brand-mark">I</span><span>INDINEXT</span></div>
<div class="abstract-scene material-scene" aria-hidden="true">
  <div class="material-halo"></div>
  <div class="glass-slab slab-back"></div>
  <div class="glass-slab slab-mid"></div>
  <div class="glass-slab slab-front"><span class="slab-reflection"></span></div>
  <div class="champagne-filament filament-a"></div>
  <div class="champagne-filament filament-b"></div>
  <div class="material-glint"></div>
  <div class="material-caption">EUROPEAN ENGINEERING <span>—</span> REFINED MATERIALS</div>
</div>
<div class="showcase-copy">
  <div class="showcase-eyebrow">INDINEXT · PREMIUM WINDOWS &amp; DOORS</div>
  <h2>Crafted to fit.<br><em>Installed to last.</em></h2>
  <p>European-inspired engineering, refined materials and precision-crafted solutions for modern spaces.</p>
</div>
</section><section class="login-shell">
    <h1>Indinext</h1>
    <p class="subtitle">Employee Login Portal</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="employeeId">Employee ID</label>
        <input id="employeeId" name="employeeId" autocomplete="username" placeholder="Enter employee ID" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      </div>

      <button id="loginButton" type="submit">Login</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>
</section></main>

  <script>
    const API = 'https://indiframe-helpdesk-api.mukuls2302.workers.dev';
    const showMessage = (text, type = 'error') => {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = 'message ' + (type === 'success' ? 'success' : '');
    };

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const employeeId = document.getElementById('employeeId').value.trim();
      const password = document.getElementById('password').value;
      const button = document.getElementById('loginButton');

      if (!employeeId || !password) {
        showMessage('Please enter both Employee ID and password.');
        return;
      }

      button.disabled = true;
      showMessage('Logging in...');

      try {
        const response = await fetch(API + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employeeId, password })
        });

        let data = {};
        try { data = await response.json(); } catch {}

        if (!response.ok) {
          throw new Error(data.error || 'Invalid Employee ID or password');
        }

        if (!data.token) {
          throw new Error('Login response mein token nahi mila.');
        }

        sessionStorage.setItem('indiframe_token', data.token);

        const shouldForcePasswordChange = data.mustChangePassword === true;

        if (shouldForcePasswordChange) {
          sessionStorage.setItem('forcePasswordChange', 'true');
          showMessage('Default password detected. Redirecting to password change...', 'success');
          setTimeout(() => window.location.href = 'change-password.html', 500);
          return;
        }

        sessionStorage.setItem('forcePasswordChange', 'false');
        showMessage('Login successful! Opening dashboard...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 500);
      } catch (error) {
        const text = error.message === 'Failed to fetch'
          ? 'Server se connect nahi ho raha. API settings check karein.'
          : error.message;
        showMessage(text);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
