<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Secure employee access to the INDINEXT Agent Help Desk workspace.">
  <title>INDINEXT Agent Help Desk — Employee Access</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css?v=navy-teal-gold-20261109">
  <link rel="stylesheet" href="indinext-final-ui.css?v=navy-teal-gold-20261109">
  <link rel="stylesheet" href="indinext-brand-system.css?v=navy-teal-gold-20261109">
  <link rel="stylesheet" href="login-copper-refinement.css?v=copper-sun-logo-planets-20261110">
</head>
<body class="helpdesk-login intro-running">
  <div class="indinext-intro" id="indinextIntro" aria-hidden="true">
    <div class="indinext-hole">
      <span class="indinext-ring indinext-ring-outer"></span>
      <span class="indinext-ring indinext-ring-inner"></span>
      <span class="indinext-core"></span>
      <img class="indinext-intro-logo" src="indinext-logo.svg" alt="INDINEXT">
    </div>
    <p class="indinext-tagline">CRAFTED TO FIT. INSTALLED TO LAST.</p>
  </div>

  <div class="space-backdrop" aria-hidden="true">
    <div class="space-nebula"></div>
    <div class="solar-scene" id="solarScene">
      <div class="sun-core" aria-label="INDINEXT logo"><img class="sun-logo" src="indinext-logo.svg" alt="INDINEXT"></div>
      <div class="planet-orbit orbit-measure"><div class="planet-wrap"><span class="planet planet-measure"></span><span class="planet-label">MEASURE</span></div></div>
      <div class="planet-orbit orbit-quote"><div class="planet-wrap"><span class="planet planet-quote"></span><span class="planet-label">QUOTE</span></div></div>
      <div class="planet-orbit orbit-design"><div class="planet-wrap"><span class="planet planet-design"></span><span class="planet-label">DESIGN</span></div></div>
      <div class="planet-orbit orbit-manufacture"><div class="planet-wrap"><span class="planet planet-manufacture"></span><span class="planet-label">MANUFACTURE</span></div></div>
      <div class="planet-orbit orbit-deliver"><div class="planet-wrap"><span class="planet planet-deliver"></span><span class="planet-label">DELIVER</span></div></div>
      <div class="planet-orbit orbit-install"><div class="planet-wrap"><span class="planet planet-install"></span><span class="planet-label">INSTALL</span></div></div>
      <div class="planet-orbit orbit-service"><div class="planet-wrap"><span class="planet planet-service"></span><span class="planet-label">SERVICE</span></div></div>
    </div>
  </div>

  <div class="starfield" id="starfield" aria-hidden="true"></div>
  <div class="ambient ambient-blue" aria-hidden="true"></div>
  <div class="ambient ambient-peach" aria-hidden="true"></div>

  <main class="login-stage login-only-layout">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="glass-card">
        <div class="card-topline"><span class="status-dot"></span><span>SECURE ACCESS</span></div>
        <div class="card-heading">
          <p class="card-kicker">WELCOME BACK</p>
          <h2 id="login-title">Sign in</h2>
          <p>Enter your employee credentials to continue.</p>
        </div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="employeeId">Employee ID</label>
            <input id="employeeId" name="employeeId" autocomplete="username" placeholder="Enter your Employee ID" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          </div>
          <button id="loginButton" type="submit"><span>Sign in to workspace</span><span class="button-arrow" aria-hidden="true">↗</span></button>
          <div id="message" class="message" role="status" aria-live="polite"></div>
        </form>
        <div class="card-footer"><span class="footer-shield">◇</span> Your workspace is protected by secure sign-in.</div>
      </div>
    </section>

    <footer class="brand-footer" aria-label="INDINEXT brand">
      <span class="brand-footer-name">INDINEXT</span>
      <span class="brand-footer-tagline">Crafted to Fit. Installed to Last.</span>
    </footer>
  </main>
  <script src="login.js?v=blackhole-intro-4100-20261109" defer></script>
</body>
</html>
