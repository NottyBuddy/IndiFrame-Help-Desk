name = "indiframe-helpdesk-api"
main = "worker.js"
compatibility_date = "2025-01-01"
keep_vars = true

# Production D1 binding.
[[d1_databases]]
binding = "DB"
database_name = "indiframe-helpdesk-db"
database_id = "8854232a-6e8f-4fe9-849c-5b61dc229602"

# Intentionally no previews.d1_databases binding here.
# Preview must not inherit or write to the production database.
# Add a dedicated Preview D1 database ID before enabling preview DB-backed routes.

# Do not store passwords, API tokens, or other secrets in this file.
# Deployment trigger: keep the existing Worker configuration unchanged.
