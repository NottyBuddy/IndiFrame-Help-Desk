<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Break Management — IndiFrame Help Desk</title><link rel="stylesheet" href="dashboard.css"><style>
.break-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.break-card{background:#fff;border:1px solid #dce5f1;border-radius:12px;padding:18px}.break-card h2{margin-top:0}.break-time{font-size:32px;font-weight:700;color:#173b70;margin:12px 0}.break-controls{display:flex;gap:10px;flex-wrap:wrap}.break-controls select{padding:10px;border:1px solid #dce5f1;border-radius:8px}.break-btn{padding:10px 14px;border:0;border-radius:8px;background:#173b70;color:#fff;font-weight:700;cursor:pointer}.break-btn:disabled{opacity:.5;cursor:not-allowed}.break-list{width:100%;border-collapse:collapse}.break-list td,.break-list th{padding:10px;border-bottom:1px solid #e8edf4;text-align:left}.break-list th{font-size:12px;color:#65748b}.break-message{margin:12px 0;color:#52627b}.break-message.error{color:#b42318}
</style></head><body><header class="topbar"><div><div class="brand">IndiFrame Help Desk</div><div class="subtitle">Agent Break Management</div></div><div class="topright"><a href="dashboard.html" class="logout-btn" style="text-decoration:none">Dashboard</a><button id="logoutBtn" class="logout-btn">Logout</button></div></header>
<main class="wrap"><div class="head"><div><h1>Break Management</h1><div class="muted">Break start/end server par record hoga.</div></div><div id="profile" class="profile muted">Loading…</div></div><div id="message" class="break-message" role="status"></div>
<div class="break-grid"><section class="break-card"><h2>My Current Break</h2><div id="breakStatus" class="muted">Status load ho raha hai…</div><div id="elapsed" class="break-time">00:00:00</div><div class="break-controls"><select id="breakType"><option value="tea">Tea Break</option><option value="lunch">Lunch Break</option><option value="bio">Bio Break</option><option value="personal">Personal</option><option value="other">Other</option></select><button id="startBreak" class="break-btn">Start Break</button><button id="endBreak" class="break-btn" disabled>End Break</button></div></section>
<section id="teamCard" class="break-card hidden"><h2>Team Active Breaks</h2><div class="muted">Admin view — live active break status</div><div id="teamBreaks" style="margin-top:12px">Loading…</div></section></div>
<section class="card section"><h2>My Recent Break History</h2><div id="history" class="empty">Loading…</div></section></main>
<script src="api.js"></script><script src="breaks.js"></script></body></html>
